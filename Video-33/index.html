<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>execise</title>
    <style>
        :root{
            --nav-color : yellow;
            --hover-color : rgb(75, 75, 205);
            --hover-text : white;
        }
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: lightgray;
        }
        ul{
            display: flex;
        }
        li{
            padding: 10px;
            list-style: none;
            /* background-color: yellow; */
        }
        div{
            background-color: var(--nav-color);
        }
        li:hover{
            background-color: var(--hover-color);
            color: var(--hover-text);
        }
    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
</body>
</html>
