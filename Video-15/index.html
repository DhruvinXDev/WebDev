<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <!-- code for external CSS -->
     <link rel="stylesheet" href="style.css">
    <!-- code of internal css -->
    <style>
        .internal{
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <dl>
        <dt>Three ways to add css to html</dt>
        <ul>
            <li>inline css</li>
            <li>internal css</li>
            <li>external css</li>
        </ul>
    </dl>
    <div style="background-color: aqua;">Example of inline CSS</div>
    <div class="internal">Example of inline CSS</div>
    <div class="external">Example of external CSS</div>

</body>

</html>
