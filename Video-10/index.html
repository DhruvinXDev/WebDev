<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video control's</title>
</head>

<body>
    <video src="video.mp4" controls muted poster="download.jpg"></video> <!--autoplay for auto play video-->
    <audio src="sachin.mp3" controls muted preload="auto"></audio> <!--autoplay for auto play audio-->
    <!-- none: Indicates that the audio should not be preloaded.
    metadata: Indicates that only audio metadata (e.g. length) is fetched.
    auto: Indicates that the whole audio file can be downloaded, even if the user is not expected to use it.
    empty string: A synonym of the auto value. -->
    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    <img src="img.svg" alt="svg not found">
    <iframe width="300" height="250" src="https://www.youtube.com/embed/tVzUXW6siu0?si=NuQZuYqrMHn7Pg-i&amp;start=739" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    

</body>

</html>
