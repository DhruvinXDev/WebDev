<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow</title>
    <style>
        *{
            font-weight:  900;
        }
        .first{
            margin: 20px;
            padding: 10px;
            border: 2px solid black;
            background-color: yellow;
            box-shadow: inset 4px 3px 20px 0px black;
            /* box-shadow: 10px 15px 10px 0px blue; */
            text-align: center;
        }
        .second{
            margin: 20px;
            padding: 10px;
            border: 2px solid black;
            background-color: yellow;
            /* box-shadow: inset 4px 3px 20px 0px black; */
            box-shadow: 10px 15px 10px 0px blue;
            text-align: center;
        }
        p{
            text-shadow:4px 2px 8px blue; 
            border: 2px solid black;
            margin: 50px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="first">hello my name is dhruvin</div>
    <div class="second">i am second div </div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe, perferendis! Cum sunt alias voluptate provident quasi iste, nesciunt optio, maxime, expedita illo distinctio! Vero enim, ipsa deleniti accusamus eos aspernatur?</p>
</body>
</html>
