<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>more on css selector</title>
    <style>
        box:first-child{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box">hello i am first div</div>
        <div class="box">hello i am second div</div>
        <div class="box">hello i am thred div</div>
        <div class="box">hello i am four div</div>
    </div>
</body>
</html>
