<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Video card | YouTube </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="side"></div>
        <div class="thumbnail">
            <img id="img" src="https://i.ytimg.com/vi/KtL-SQ20Q0s/hqdefault.jpg?sqp=-oaymwEbCKgBEF5IVfKriqkDDggBFQAAiEIYAXABwAEG&rs=AOn4CLABJhdIBqlilwXKzJqa6StynbJT4Q" alt="">
            <div class="duration">31:22</div>
        </div>
        <div class="text">
            <div class="title">Introduction to Backend | Sigma Web Dev video #2</div>
            <div class="other">
                <div class="cname">CodeWithHarry</div>
                <ul>
                    <li><div class="view">560000</div></li>
                    <li><div class="months">7 months ago</div></li>
                </ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
