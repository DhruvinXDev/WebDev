<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list style</title>
    <style>
        li {
            margin: 15px;
            padding: 15px;
            background-color: aqua;
            /* list-style: none; */
            list-style: inside;
            /* list-style-type:devanagari; */
            border: 2px solid black;
            /* list-style-image: url(download.jpg); */
            /* list-style-type: "😇"; */
            /* list-style: disc inside url(download.jpg); */

        }
        .nav{
            display: flex;
        }
        .nav li {
            list-style: none;
        }
    </style>
</head>

<body>
    <div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contect</li>
        </ul>
    </div>
    <ul class="nav">
        <li>Home</li>
        <li>About</li>
        <li>Contect</li>
    </ul>
</body>

</html>
